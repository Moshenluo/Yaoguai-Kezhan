<title id="shengsheng-03-title">狌狌 · 拱手迎宾</title>
<desc id="shengsheng-03-desc">参考妖怪客栈狌狌绘制的可编辑矢量角色：大白耳与桃色耳心、琥珀棕毛、奶油心形面罩与胸毛、深色手足、卷曲长尾和扬起的额发。</desc>
