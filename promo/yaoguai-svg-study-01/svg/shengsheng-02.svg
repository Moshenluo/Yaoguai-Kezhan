<title id="shengsheng-02-title">狌狌 · 笑迎招手</title>
<desc id="shengsheng-02-desc">参考妖怪客栈狌狌绘制的可编辑矢量角色：大白耳与桃色耳心、琥珀棕毛、奶油心形面罩与胸毛、深色手足、卷曲长尾和扬起的额发。</desc>
